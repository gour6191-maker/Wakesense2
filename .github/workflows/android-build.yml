
name: Build WakeSense APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'WakeSense-v022-GitHub-Source.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract WakeSense source
        run: |
          unzip -o WakeSense-v022-GitHub-Source.zip

      - name: Fix Android SDK compatibility
        run: |
          sed -i 's/compileSdk = 35/compileSdk = 36/' WakeSense/app/build.gradle.kts
          sed -i 's/version "8.9.1"/version "8.10.1"/' WakeSense/build.gradle.kts

      - name: Fix Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("WakeSense/app/build.gradle.kts")
          s = p.read_text()

          needle = "    buildFeatures { compose = true }"

          replacement = """    compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = "17"
            }

            buildFeatures { compose = true }"""

          if needle not in s:
              raise SystemExit("Could not find expected build.gradle.kts section")

          p.write_text(s.replace(needle, replacement, 1))
          print("Java and Kotlin targets set to JVM 17")
          PY

      - name: Fix Health Connect permission import
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("WakeSense/app/src/main/java/com/majilabs/wakesense/MainActivity.kt")
          s = p.read_text()

          s = s.replace(
              "import androidx.health.connect.client.permission.PermissionController",
              "import androidx.health.connect.client.PermissionController"
          )

          s = s.replace(
              ") { granted ->",
              ") { granted: Set<String> ->",
              1
          )

          p.write_text(s)
          print("Health Connect permission import fixed")
          PY

      - name: Run unit tests
        run: gradle -p WakeSense :app:testDebugUnitTest

      - name: Build APK
        run: gradle -p WakeSense :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WakeSense-APK
          path: WakeSense/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
